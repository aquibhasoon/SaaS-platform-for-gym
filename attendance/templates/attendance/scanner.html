<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Scanner</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .scanner-container {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .scanner-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        #reader {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        .manual {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .manual h3 {
            margin-top: 0;
        }

        .manual form {
            display: flex;
            gap: 10px;
        }

        .manual input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .manual button {
            padding: 12px 16px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #374151;
            text-decoration: none;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #f3f4f6;
            text-align: center;
        }

        @media (max-width: 600px) {

            .scanner-card {
                padding: 20px;
            }

            .manual form {
                flex-direction: column;
            }

            .manual button,
            .manual input {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="scanner-container">

    <div class="scanner-card">


        <div class="header">

            <h1>
                📷 QR Scanner
            </h1>

            <p>
                Scan a member QR code to record attendance.
            </p>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <div id="reader"></div>


        <div class="manual">

            <h3>
                Manual QR Token
            </h3>

            <form
                method="post"
                id="manual-form"
            >

                {% csrf_token %}

                <input
                    type="text"
                    name="qr_token"
                    id="qr_token"
                    placeholder="Enter QR token"
                    required
                >

                <button type="submit">
                    Check In
                </button>

            </form>

        </div>


        <a
            href="{% url 'attendance:list' %}"
            class="back"
        >
            ← Back to Attendance
        </a>


    </div>

</div>


<script src="https://unpkg.com/html5-qrcode"></script>


<script>

    function submitQR(token) {

        document.getElementById("qr_token").value = token;

        document.getElementById("manual-form").submit();

    }


    function onScanSuccess(decodedText) {

        submitQR(decodedText);

    }


    function onScanFailure(error) {

        // Ignore scanning failures while searching for a QR code.

    }


    const scanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,
            qrbox: {
                width: 250,
                height: 250
            }
        },
        false
    );


    scanner.render(
        onScanSuccess,
        onScanFailure
    );

</script>


</body>

</html>
