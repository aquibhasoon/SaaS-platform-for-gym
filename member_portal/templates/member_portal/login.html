<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(135deg,
                    #eef2ff,
                    #f8fafc);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            color: #111827;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 15px;

            border-radius: 18px;

            background: #4f46e5;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            box-shadow:
                0 12px 30px rgba(79,
                    70,
                    229,
                    0.25);
        }

        .brand h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 800;
        }

        .brand p {
            margin: 7px 0 0;

            color: #64748b;

            font-size: 14px;
        }

        .login-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(15,
                    23,
                    42,
                    0.08);
        }

        .login-card h2 {
            margin: 0 0 6px;

            font-size: 22px;
        }

        .login-card .subtitle {
            margin: 0 0 25px;

            color: #64748b;

            font-size: 13px;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 11px 13px;

            border-radius: 10px;

            background: #fef2f2;

            color: #b91c1c;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #334155;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #dbe1ea;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition:
                border-color .15s ease,
                box-shadow .15s ease;
        }

        input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,
                    102,
                    241,
                    0.12);
        }

        .login-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #4f46e5;

            color: white;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform .15s ease,
                background .15s ease;
        }

        .login-button:hover {
            background: #4338ca;

            transform: translateY(-1px);
        }

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 12px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 23px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }
    </style>

</head>

<body>

    <div class="login-wrapper">

        <div class="brand">

            <div class="brand-icon">
                🏋️
            </div>

            <h1>
                Member Portal
            </h1>

            <p>
                Your fitness journey in one place
            </p>

        </div>


        <div class="login-card">

            <h2>
                Welcome back
            </h2>

            <p class="subtitle">
                Sign in to access your gym account.
            </p>


            {% if messages %}

            <div class="messages">

                {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

                {% endfor %}

            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="field">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" placeholder="Enter your username"
                        autocomplete="username" required>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>

                </div>
                <div style="
    text-align: right;
    margin-top: 8px;
">
    <a
        href="{% url 'accounts:password_reset' %}"
        style="
            color: #4f46e5;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        "
    >
        Forgot Password?
    </a>
</div>


                <button type="submit" class="login-button">
                    Sign In
                </button>

                <div style="
    text-align: center;
    margin-top: 16px;
    color: #64748b;
    font-size: 14px;
">
                    Don't have an account?
                    <a href="{% url 'member_portal:register' %}" style="
            color: #7c3aed;
            font-weight: 700;
            text-decoration: none;
        ">
                        Register as a Member
                    </a>
                </div>

            </form>

        </div>


        <div class="footer">
            Member access only
        </div>

    </div>



</body>

</html>
