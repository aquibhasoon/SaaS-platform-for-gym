<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            color: #111827;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: block;
            margin-top: 25px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>Password Changed!</h1>

    <p>
        Your password has been successfully updated.
        You can now sign in using your new password.
    </p>

    <a href="{% url 'accounts:login' %}">
        Sign In
    </a>

</div>

</body>
</html>
