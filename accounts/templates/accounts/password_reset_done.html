<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Link Sent</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ede9fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .note {
            margin-top: 24px;
            padding: 14px;
            background: #f8fafc;
            border-radius: 10px;
            font-size: 14px;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">✉️</div>

    <h1>Check Your Email</h1>

    <p>
        If an account exists with that email address,
        we've sent instructions to reset your password.
    </p>

    <div class="note">
        For local development, check your Django terminal
        for the reset link.
    </div>

    <a href="{% url 'accounts:login' %}">
        ← Back to Login
    </a>

</div>

</body>
</html>
