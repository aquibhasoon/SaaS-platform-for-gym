<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            color: #111827;
            font-size: 28px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d7dce8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 700;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Forgot Password?</h1>

    <p class="description">
        Enter the email address associated with your account.
        We'll provide you with a secure password reset link.
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="id_email">Email Address</label>

        {{ form.email }}

        {% if form.email.errors %}
            <div class="error">
                {{ form.email.errors }}
            </div>
        {% endif %}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <div class="back">
        <a href="{% url 'accounts:login' %}">
            ← Back to Login
        </a>
    </div>

</div>

</body>
</html>
